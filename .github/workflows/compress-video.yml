name: Fast High-Speed Video Compression and Upload

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct HTTPS URL to the video'
        required: true
        type: string
      target_size_gb:
        description: 'Target File Size in GB (e.g., 0.5 for 500MB)'
        required: true
        default: '2'
        type: string

jobs:
  compress-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android

      - name: Install Tools (FFmpeg & Aria2)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg aria2

      - name: Download Video with Multi-Stream Aria2
        run: |
          echo "Downloading via multi-connection aria2c..."
          # -x16 opens up to 16 parallel connections to download chunks concurrently
          aria2c -x 16 -s 16 "${{ inputs.video_url }}" -o input_file

      - name: Fast Single-Pass Target Compression
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input_file)
          TARGET_SIZE_BITS=$(echo "${{ inputs.target_size_gb }} * 1024 * 1024 * 1024 * 8" | bc)
          AUDIO_STREAMS=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 input_file | wc -l)
          TOTAL_AUDIO_BITRATE=$((AUDIO_STREAMS * 128000))
          TOTAL_BITRATE=$(echo "scale=0; $TARGET_SIZE_BITS / $DURATION" | bc)
          VIDEO_BITRATE=$((TOTAL_BITRATE - TOTAL_AUDIO_BITRATE))
          
          if [ $VIDEO_BITRATE -lt 400000 ]; then
            VIDEO_BITRATE=400000
          fi

          echo "Encoding with ultrafast preset..."
          # Using -preset ultrafast skips heavy CPU processing delays while hitting your size target
          ffmpeg -y -i input_file \
            -map 0:v? -map 0:a \
            -c:v libx264 -b:v ${VIDEO_BITRATE} -preset ultrafast \
            -c:a aac -b:a 128k \
            output_video.mp4

          ls -lh input_file output_video.mp4

      - name: Upload to udrop
        env:
          UDROP_KEY1: ${{ secrets.UDROP_KEY1 }}
          UDROP_KEY2: ${{ secrets.UDROP_KEY2 }}
        run: |
          echo "Authenticating with udrop..."
          AUTH_RESPONSE=$(curl -s -X POST https://www.udrop.com/api/v2/authorize \
            -d "key1=$UDROP_KEY1" \
            -d "key2=$UDROP_KEY2")
          
          ACCESS_TOKEN=$(echo $AUTH_RESPONSE | grep -o '"access_token":"[^"]*' | grep -o '[^"]*$' )
          ACCOUNT_ID=$(echo $AUTH_RESPONSE | grep -o '"account_id":[^,}]*' | grep -o '[0-9]*' )

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Error: Failed to authenticate with udrop."
            exit 1
          fi

          echo "Uploading compressed video to udrop..."
          curl -s -X POST https://www.udrop.com/api/v2/file/upload \
            -F "access_token=$ACCESS_TOKEN" \
            -F "account_id=$ACCOUNT_ID" \
            -F "upload_file=@output_video.mp4"

          echo "Upload complete!"
