name: Remote Split & Cloudflare Tunnel Upload

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct HTTPS URL of the large video'
        required: true
      file_name:
        description: 'Target Base Name (e.g. Oppenheimer.2023.1080p)'
        required: true

permissions:
  contents: read

jobs:
  split_and_tunnel_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Cloudflared
        run: |
          sudo apt-get update
          sudo apt-get install -y mkvtoolnix aria2 curl python3
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

      - name: High-Speed Multi-Connection Download (aria2c)
        run: |
          echo "Downloading source file..."
          aria2c -x 16 -s 16 -k 1M \
            --file-allocation=none \
            --summary-interval=5 \
            -o "source_input.mkv" \
            "${{ inputs.file_url }}"

      - name: Split File into Playable Segments (<4.8GB)
        run: |
          echo "Splitting media losslessly..."
          mkdir -p public_files
          
          mkvmerge \
            --engage append_and_split_flac \
            --split size:4700M \
            -o "public_files/part-%02d.mkv" \
            "source_input.mkv" || MERGE_STATUS=$?

          if [ "${MERGE_STATUS:-0}" -gt 1 ]; then
            echo "❌ mkvmerge failed with fatal exit code $MERGE_STATUS"
            exit $MERGE_STATUS
          fi

          rm -f "source_input.mkv"
          ls -lh public_files/

      - name: Start File Server & Cloudflare Tunnel
        id: tunnel
        run: |
          # 1. Start Python HTTP Server inside the split files folder
          nohup python3 -m http.server 8080 --directory public_files > server.log 2>&1 &
          
          # 2. Start Cloudflare Tunnel
          cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          
          # 3. Wait for tunnel URL to generate
          echo "Waiting for Cloudflare Tunnel to spin up..."
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]\+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Failed to create Cloudflare Tunnel."
            cat tunnel.log
            exit 1
          fi

          echo "✅ Tunnel active: $TUNNEL_URL"
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

      - name: Ingest Chunks to uDrop via Remote URL Upload
        env:
          UDROP_ACCOUNTS_JSON: ${{ secrets.UDROP_ACCOUNTS_JSON }}
          BASE_NAME: ${{ inputs.file_name }}
          TUNNEL_URL: ${{ env.TUNNEL_URL }}
        run: node uploader.js
