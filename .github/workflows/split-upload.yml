name: Remote Split & Multi-Account Upload

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct HTTPS URL of the large video'
        required: true
      file_name:
        description: 'Target Base Name (e.g. Oppenheimer.2023.1080p)'
        required: true

permissions:
  contents: read

jobs:
  split_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mkvtoolnix aria2

      - name: High-Speed Multi-Connection Download (aria2c)
        run: |
          echo "Starting multi-connection download..."
          aria2c -x 16 -s 16 -k 1M \
            --file-allocation=none \
            --summary-interval=5 \
            -o "source_input.mkv" \
            "${{ inputs.file_url }}"

      - name: Split File into Playable Segments (<4GB)
        run: |
          echo "Splitting media losslessly across all tracks/codecs..."
          
          mkvmerge \
            --engage append_and_split_flac \
            --split size:3800M \
            -o "part-%02d.mkv" \
            "source_input.mkv" || MERGE_STATUS=$?

          if [ "${MERGE_STATUS:-0}" -gt 1 ]; then
            echo "❌ mkvmerge failed with fatal exit code $MERGE_STATUS"
            exit $MERGE_STATUS
          fi

          echo "✅ Split completed successfully (Exit status: ${MERGE_STATUS:-0})"
          rm -f "source_input.mkv"
          ls -lh part-*.mkv

      - name: Distribute Chunks Across Accounts
        env:
          UDROP_ACCOUNTS_JSON: ${{ secrets.UDROP_ACCOUNTS_JSON }}
          BASE_NAME: ${{ inputs.file_name }}
        run: node uploader.js
