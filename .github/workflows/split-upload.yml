name: Remote Split & Multi-Account Upload

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct HTTPS URL of the large video'
        required: true
      file_name:
        description: 'Target Base Name (e.g. Oppenheimer.2023.1080p)'
        required: true

permissions:
  contents: read

jobs:
  split_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MKVToolNix
        run: |
          sudo apt-get update
          sudo apt-get install -y mkvtoolnix curl

      - name: Download Large File
        run: |
          echo "Downloading source file..."
          curl -L -o "source_input.mkv" "${{ inputs.file_url }}"

      - name: Split File into Playable Segments (<4.7GB)
        run: |
          # Slices file cleanly into standalone MKVs
          mkvmerge -o "part-%02d.mkv" --split size:4700M "source_input.mkv"
          rm "source_input.mkv"
          ls -lh part-*.mkv

      - name: Distribute Chunks Across Accounts
        env:
          UDROP_ACCOUNTS_JSON: ${{ secrets.UDROP_ACCOUNTS_JSON }}
          BASE_NAME: ${{ inputs.file_name }}
        run: node uploader.js
