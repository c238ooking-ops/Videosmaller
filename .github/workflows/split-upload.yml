name: Remote Split & Multi-Account Upload

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct HTTPS URL to the video (Skydrop, Pixeldrain, etc.)'
        required: true
      file_name:
        description: 'Target Base Name (e.g. Spider-Man.2.2004.1080p)'
        required: true

permissions:
  contents: read

jobs:
  split_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python (For Playwright Skydrop Bypass)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache APT packages so ffmpeg, ffprobe, mkvmerge, and aria2 don't download from internet every time
      - name: Cache APT Packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-packages-${{ runner.os }}-media-tools-v1
          restore-keys: |
            apt-packages-${{ runner.os }}-media-tools-

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install System Tools (FFmpeg, MKVToolNix, Aria2) with Local Cache Fallback
        run: |
          sudo apt-get update -y
          # Ensure local cache folder exists for apt
          sudo mkdir -p /var/cache/apt/archives
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix aria2 wget curl
          pip install --no-cache-dir requests requests-toolbelt playwright

      - name: Install Playwright Browser (Conditional)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium --with-deps

      - name: Smart Download Engine (Skydrop / Pixeldrain / Direct via aria2c)
        env:
          FILE_URL: ${{ inputs.file_url }}
        run: |
          python - << 'EOF'
          import os
          import re
          import asyncio
          from playwright.async_api import async_playwright

          FILE_URL = os.environ.get("FILE_URL", "").strip()
          download_filename = "source_input.mkv"

          async def download_skydrop(url):
              print("🌐 Skydrop link detected. Launching automated headless browser...")
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(accept_downloads=True)
                  page = await context.new_page()
                  
                  await page.goto(url, wait_until="networkidle")
                  try:
                      download_btn = page.locator("a:has-text('Download Video'), button:has-text('Download Video')")
                      await download_btn.wait_for(state="visible", timeout=20000)
                      
                      async with page.expect_download(timeout=60000) as download_info:
                          await download_btn.first.click()
                      
                      download = await download_info.value
                      await download.save_as(download_filename)
                      print(f"🎉 Successfully downloaded via Playwright: {download.suggested_filename}")
                  except Exception as e:
                      raise Exception(f"❌ Playwright download failed for Skydrop: {e}")
                  finally:
                      await browser.close()

          download_url = FILE_URL
          pixeldrain_match = re.search(r'pixeldrain\.(?:dev|com)/u/([a-zA-Z0-9_-]+)', download_url)
          if pixeldrain_match:
              download_url = f"https://pixeldrain.com/api/file/{pixeldrain_match.group(1)}"

          if "skydrop" in download_url:
              asyncio.run(download_skydrop(download_url))
          else:
              dl_cmd = f'aria2c -x 16 -s 16 -k 2M --file-allocation=none -o "{download_filename}" "{download_url}"'
              if os.system(dl_cmd) != 0 or not os.path.exists(download_filename):
                  raise Exception("❌ Standard download failed.")
          EOF

      - name: Lossless Slice to MPEG-TS with Multi-Audio & Subtitle Retention
        run: |
          echo "Slicing lossless MPEG-TS segments (1 hour cuts, keeping all audio streams & subtitles)..."
          ffmpeg -y -i "source_input.mkv" \
            -map 0 \
            -c copy \
            -f segment \
            -segment_time 3600 \
            -reset_timestamps 0 \
            "part-%02d.ts"

          rm -f "source_input.mkv"
          ls -lh part-*.ts

      - name: Distribute Chunks to uDrop Accounts
        env:
          UDROP_ACCOUNTS_JSON: ${{ secrets.UDROP_ACCOUNTS_JSON }}
          BASE_NAME: ${{ inputs.file_name }}
          SYNC_WORKER_URL: ${{ secrets.SYNC_WORKER_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: node uploader.js
